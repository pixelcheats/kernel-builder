name: Build OnePlus 7 Kernel with KSU + Kprobes

on:
  workflow_dispatch:
    inputs:
      kernelsu_version:
        description: 'KernelSU version (e.g., v0.9.5, leave empty for latest)'
        required: false
        default: ''
      use_susfs:
        description: 'Enable SUSFS support'
        required: false
        default: 'true'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        swap-size-mb: 8192
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git bc bison build-essential ccache curl flex \
          g++-multilib gcc-multilib git gnupg gperf \
          lib32ncurses5-dev lib32z1-dev libelf-dev \
          liblz4-tool libncurses5-dev libsdl1.2-dev \
          libssl-dev libxml2 libxml2-utils lzop \
          pngcrush rsync schedtool squashfs-tools xsltproc \
          zip zlib1g-dev python3 python-is-python3 \
          libarchive-tools cpio zstd
          
    - name: Clone kernel source
      run: |
        git clone --depth=1 -b 16-c https://github.com/QuinceROMs/android_kernel_oneplus_sm8150.git kernel
        cd kernel
        echo "Kernel cloned successfully"
        
    - name: Setup KernelSU
      run: |
        cd kernel
        
        # Use specified version or latest
        if [ -n "${{ github.event.inputs.kernelsu_version }}" ]; then
          KSU_VERSION="${{ github.event.inputs.kernelsu_version }}"
          echo "Using KernelSU version: $KSU_VERSION"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s $KSU_VERSION
        else
          echo "Using latest KernelSU"
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        fi
        
        # Verify KernelSU was set up
        if [ -d "drivers/kernelsu" ]; then
          echo "KernelSU directory created successfully"
          ls -la drivers/kernelsu/
        else
          echo "ERROR: KernelSU setup failed!"
          exit 1
        fi
        
    - name: Setup Clang toolchain
      run: |
        mkdir -p toolchain
        cd toolchain
        
        # Use Neutron Clang
        curl -LO "https://raw.githubusercontent.com/nicoleellaaa/nicoleellaaa.github.io/main/files/neutron-clang-20250328.tar.zst"
        tar -I zstd -xf neutron-clang-20250328.tar.zst
        rm neutron-clang-20250328.tar.zst
        
        # Find the clang binary and set path
        CLANG_BIN=$(find . -name "clang" -type f | head -1)
        if [ -z "$CLANG_BIN" ]; then
          echo "ERROR: clang not found in toolchain!"
          exit 1
        fi
        
        TOOLCHAIN_DIR=$(dirname "$CLANG_BIN")
        echo "Found clang at: $TOOLCHAIN_DIR"
        echo "TOOLCHAIN_BIN=$GITHUB_WORKSPACE/toolchain/${TOOLCHAIN_DIR#./}" >> $GITHUB_ENV
        
        # Verify
        ls -la "$TOOLCHAIN_DIR"
        
    - name: Verify KernelSU integration in Makefile
      run: |
        cd kernel
        
        echo "=== Checking drivers/Makefile for KernelSU ==="
        if grep -q "kernelsu" drivers/Makefile; then
          echo "KernelSU found in drivers/Makefile"
          grep -n "kernelsu" drivers/Makefile
        else
          echo "WARNING: KernelSU not in drivers/Makefile, adding manually..."
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
        fi
        
    - name: Verify KernelSU integration in Kconfig
      run: |
        cd kernel
        
        echo "=== Checking drivers/Kconfig for KernelSU ==="
        if grep -q "kernelsu/Kconfig" drivers/Kconfig; then
          echo "KernelSU Kconfig already sourced"
          grep -n "kernelsu" drivers/Kconfig
        else
          echo "WARNING: KernelSU Kconfig not sourced, adding manually..."
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        fi

    - name: Enable Kprobes and KSU in defconfig
      run: |
        cd kernel
        
        # Find defconfig
        DEFCONFIG="arch/arm64/configs/vendor/sm8150-perf_defconfig"
        if [ ! -f "$DEFCONFIG" ]; then
          DEFCONFIG=$(find arch/arm64/configs -name "*sm8150*defconfig" | head -1)
        fi
        
        if [ -z "$DEFCONFIG" ] || [ ! -f "$DEFCONFIG" ]; then
          echo "ERROR: Could not find defconfig!"
          exit 1
        fi
        
        echo "Using defconfig: $DEFCONFIG"
        
        # Remove existing configs to avoid duplicates
        sed -i '/CONFIG_KPROBES/d' $DEFCONFIG
        sed -i '/CONFIG_KPROBE_EVENTS/d' $DEFCONFIG
        sed -i '/CONFIG_HAVE_KPROBES/d' $DEFCONFIG
        sed -i '/CONFIG_KRETPROBES/d' $DEFCONFIG
        sed -i '/CONFIG_KSU/d' $DEFCONFIG
        
        # Add Kprobes configs
        echo "" >> $DEFCONFIG
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
        
        # Add KernelSU configs
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        
        # Add SUSFS if enabled
        if [ "${{ github.event.inputs.use_susfs }}" = "true" ]; then
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> $DEFCONFIG
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $DEFCONFIG
        fi
        
        echo "=== Defconfig additions ==="
        tail -20 $DEFCONFIG
        
    - name: Build kernel
      run: |
        cd kernel
        
        export PATH="${TOOLCHAIN_BIN}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Show compiler info
        echo "=== Compiler Info ==="
        clang --version
        
        # Clean
        make O=out clean mrproper
        
        # Generate defconfig
        make O=out ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          vendor/sm8150-perf_defconfig
          
        # Check for oplus.config and merge if exists
        if [ -f "arch/arm64/configs/vendor/oplus.config" ]; then
          echo "Merging oplus.config..."
          cat arch/arm64/configs/vendor/oplus.config >> out/.config
          make O=out ARCH=arm64 olddefconfig
        fi
        
        # Verify key configs
        echo "=== Verifying .config ==="
        grep CONFIG_KPROBES out/.config || true
        grep CONFIG_KSU out/.config || true
        grep CONFIG_KALLSYMS out/.config || true
        
        # Build
        make O=out ARCH=arm64 \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=1 \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          -j$(nproc --all) 2>&1 | tee build.log
          
    - name: Check build result
      run: |
        cd kernel
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "Kernel built successfully: Image.gz-dtb"
          ls -la out/arch/arm64/boot/Image.gz-dtb
        elif [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel built successfully: Image.gz"
          ls -la out/arch/arm64/boot/Image.gz
        elif [ -f out/arch/arm64/boot/Image ]; then
          echo "Kernel built successfully: Image"
          ls -la out/arch/arm64/boot/Image
        else
          echo "Kernel build failed!"
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log
          echo "=== Errors ==="
          grep -i "error:" build.log | tail -50
          exit 1
        fi
        
    - name: Create AnyKernel3 zip
      run: |
        cd kernel
        
        # Clone AnyKernel3
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
        cd anykernel
        
        # Clean unnecessary files
        rm -rf .git .github modules patch ramdisk
        
        # Configure anykernel.sh for OnePlus 7
        sed -i 's/kernel.string=.*/kernel.string=OnePlus7-KSU-Kprobes-Kernel/' anykernel.sh
        sed -i 's/device.name1=.*/device.name1=OnePlus7/' anykernel.sh
        sed -i 's/device.name2=.*/device.name2=guacamoleb/' anykernel.sh
        sed -i 's|block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
        sed -i 's/is_slot_device=.*/is_slot_device=auto;/' anykernel.sh
        sed -i 's/do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
        sed -i 's/do.modules=.*/do.modules=0/' anykernel.sh
        sed -i 's/do.systemless=.*/do.systemless=1/' anykernel.sh
        sed -i 's/do.cleanup=.*/do.cleanup=1/' anykernel.sh
        
        # Add more device names
        if ! grep -q "device.name3" anykernel.sh; then
          sed -i '/device.name2=/a device.name3=GM1900' anykernel.sh
          sed -i '/device.name3=/a device.name4=GM1901' anykernel.sh
          sed -i '/device.name4=/a device.name5=GM1903' anykernel.sh
          sed -i '/device.name5=/a device.name6=GM1905' anykernel.sh
        fi
        
        # Copy kernel image
        if [ -f ../out/arch/arm64/boot/Image.gz-dtb ]; then
          cp ../out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
        elif [ -f ../out/arch/arm64/boot/Image.gz ]; then
          cp ../out/arch/arm64/boot/Image.gz Image.gz
        elif [ -f ../out/arch/arm64/boot/Image ]; then
          cp ../out/arch/arm64/boot/Image Image
        fi
        
        # Copy DTB files if they exist
        if [ -f ../out/arch/arm64/boot/dtb.img ]; then
          cp ../out/arch/arm64/boot/dtb.img dtb
        fi
        if [ -f ../out/arch/arm64/boot/dtbo.img ]; then
          cp ../out/arch/arm64/boot/dtbo.img dtbo.img
        fi
        
        # Create flashable zip
        ZIPNAME="OnePlus7-KSU-Kprobes-Kernel-$(date +%Y%m%d-%H%M).zip"
        zip -r9 "../$ZIPNAME" * -x '*.git*'
        
        echo "Flashable zip created!"
        ls -la "../$ZIPNAME"
        
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus7-KSU-Kprobes-Kernel
        path: kernel/OnePlus7-KSU-Kprobes-Kernel-*.zip
        retention-days: 30
        
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: kernel/build.log
        retention-days: 7
        
    - name: Upload config
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-config
        path: kernel/out/.config
        retention-days: 7
